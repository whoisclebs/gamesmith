name: validate

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test validator
        run: python scripts/validate.py --self-test
      - name: Validate skills and manifests
        run: python scripts/validate.py
      - name: Compile skill scripts
        run: |
          for f in skills/*/scripts/*.py; do
            [ -e "$f" ] || continue
            python -m py_compile "$f"
          done
